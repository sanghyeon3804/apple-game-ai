<text x="560" y="722" font-size="13" font-weight="400" fill="#0b7a4b" text-anchor="start">최선의 순서</text>
<path d="M1000 872 V905 H340 V876" fill="none" stroke="#6b7890" stroke-width="2" marker-end="url(#a)" stroke-dasharray="6 5"/>
<text x="670" y="898" font-size="13" font-weight="400" fill="#526079" text-anchor="middle">계속 실패하면 남은 판을 다시 읽어 재계산</text>
<text x="1160" y="958" font-size="12.5" font-weight="400" fill="#526079" text-anchor="end">* 141.4는 조합 정책(특징 없음), 145.5는 모방 학습 정책을 쓴 값. 같은 새 판 10개의 시뮬레이션 평균(최대 170).</text></svg>
