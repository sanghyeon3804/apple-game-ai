<text x="612" y="388" font-size="13" font-weight="400" fill="#1f5fbf" text-anchor="end">NRPA의 초기 정책 (고정 편향)</text>
<text x="792" y="412" font-size="13" font-weight="400" fill="#1f5fbf" text-anchor="start">행동 추출 · 롤아웃</text>
<text x="1032" y="388" font-size="13" font-weight="400" fill="#a65a00" text-anchor="end">노드 평가</text>
<rect x="20" y="740" width="1160" height="190" rx="14" fill="#f3f1fa"/>
<text x="40" y="770" font-size="17" font-weight="700" fill="#172033" text-anchor="start">3. 인식과 실행</text>
<text x="1160" y="770" font-size="13" font-weight="400" fill="#526079" text-anchor="end">화면만 보고 마우스로 플레이</text>
<rect x="50" y="790" width="160" height="82" rx="9" fill="#ffffff" stroke="#b9aede" stroke-width="1.5"/>
<text x="130.0" y="826.0" font-size="16" font-weight="700" fill="#172033" text-anchor="middle">화면 캡처</text>
<text x="130.0" y="848.0" font-size="13" font-weight="400" fill="#526079" text-anchor="middle">주 모니터 전체</text>
<rect x="260" y="790" width="160" height="82" rx="9" fill="#ffffff" stroke="#b9aede" stroke-width="1.5"/>
<text x="340.0" y="816.0" font-size="16" font-weight="700" fill="#172033" text-anchor="middle">숫자 인식</text>
<text x="340.0" y="838.0" font-size="13" font-weight="400" fill="#526079" text-anchor="middle">격자 검출 + 템플릿</text>
<text x="340.0" y="857.0" font-size="13" font-weight="400" fill="#526079" text-anchor="middle">불확실하면 중단</text>
<rect x="470" y="790" width="160" height="82" rx="9" fill="#ffffff" stroke="#b9aede" stroke-width="1.5"/>
<text x="550.0" y="816.0" font-size="16" font-weight="700" fill="#172033" text-anchor="middle">경로 검증</text>
<text x="550.0" y="838.0" font-size="13" font-weight="400" fill="#526079" text-anchor="middle">규칙대로 재생해</text>
<text x="550.0" y="857.0" font-size="13" font-weight="400" fill="#526079" text-anchor="middle">점수 확인</text>
<rect x="690" y="790" width="160" height="82" rx="9" fill="#ffffff" stroke="#b9aede" stroke-width="1.5"/>
<text x="770.0" y="826.0" font-size="16" font-weight="700" fill="#172033" text-anchor="middle">드래그 실행</text>
<text x="770.0" y="848.0" font-size="13" font-weight="400" fill="#526079" text-anchor="middle">마우스 자동 조작</text>
<rect x="920" y="790" width="160" height="82" rx="9" fill="#ffffff" stroke="#b9aede" stroke-width="1.5"/>
<text x="1000.0" y="816.0" font-size="16" font-weight="700" fill="#172033" text-anchor="middle">결과 확인</text>
<text x="1000.0" y="838.0" font-size="13" font-weight="400" fill="#526079" text-anchor="middle">사과가 사라졌는지</text>
<text x="1000.0" y="857.0" font-size="13" font-weight="400" fill="#526079" text-anchor="middle">실패하면 재시도</text>
